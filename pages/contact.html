<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="../styles/normalize.css">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

  <header class="header">
    <a class="header_logo" href="../index.html">
      <img src="../images/Logo.png" alt="Genesis">
    </a>
    <nav class="nav">
      <ul class="nav_list">
        <li class="nav_li"><a class="nav_link" href="project.html">Projects</a></li>
        <li class="nav_li"><a class="nav_link" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact">
  <div class="contact_text">
    <h1 class="contact_title">Full set of great features to make your product fresh</h1>
    <p class="contact_paragraph">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
  </div>

  <form class="contact_form">
    <input class="contact_input" type="text" placeholder="Name" aria-label="Name">
    <input class="contact_input" type="email" placeholder="Email" aria-label="Email">
    <textarea class="contact_input" rows="1" placeholder="Message" aria-label="Message"></textarea>
    <button class="contact_button" type="submit">Submit</button>
  </form>
</section>


<section class="map">
  <img class="map_img" src="../images/map.png" alt="Map of a city area">
</section>

  </main>

  <footer class="footer">
    <a class="footer_logo" href="../index.html">
      <img src="../images/Logo.png" alt="Genesis">
    </a>
    <div class="footer_right">
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_li"><a class="nav_link" href="project.html">Projects</a></li>
          <li class="nav_li"><a class="nav_link" href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <ul class="footer_social">
        <li><a href="#"><img src="../images/dribbble.png" alt="Dribbble"></a></li>
        <li><a href="#"><img src="../images/instagram.png" alt="Instagram"></a></li>
        <li><a href="#"><img src="../images/twitter.png" alt="Twitter"></a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
